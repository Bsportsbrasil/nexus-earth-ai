plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexusearthai.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.nexusearthai.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
            hostName: "nexusearthai.com",
            defaultUrl: "https://nexusearthai.com/mobile",
            launcherName: "NEXUS AI",
            assetStatements: '[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": { "namespace": "android_app", "package_name": "com.nexusearthai.app", "sha256_cert_fingerprints": ["14:6D:E9:7F:02:CD:EA:9E:C6:16:87:62:38:F5:2C:AE:34:FD:74:BF:D1:62:D2:C2:59:E8:26:BC:54:15:BE:F4"] } }]'
        ]
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
