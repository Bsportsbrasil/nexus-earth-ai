version: "3.9"

services:
  nexus-core:
    build: .
    container_name: nexus-core
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - PORT=5173
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      - nexus-graph-data:/app/data
    depends_on:
      - neo4j
      - python-worker
    restart: unless-stopped

  python-worker:
    image: python:3.12-slim
    container_name: nexus-python-worker
    working_dir: /worker
    volumes:
      - ./python_worker:/worker
    command: sh -c "pip install --no-cache-dir fastapi uvicorn pydantic && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: nexus-neo4j-graphdb
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/nexus_superintelligence
    volumes:
      - nexus-neo4j-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: nexus-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - nexus-core
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: nexus-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=nexus_admin
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  nexus-graph-data:
  nexus-neo4j-data:
